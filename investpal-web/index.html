<title>InvestPal</title>
<!-- The navy-disc variant, matching the public site. It reads better than the
     light lockup at 16-32px, where a near-white disc loses the owl. -->
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.png" sizes="32x32">

<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1a29" media="(prefers-color-scheme: dark)">

<!-- Blocking on purpose: it stamps data-theme before first paint, so a dark
     theme does not flash white. Same localStorage key as the public site, so a
     theme chosen there carries over. -->
<script>
(function(){var d=document.documentElement;d.className+=' js';
try{var t=localStorage.getItem('ip-theme');
if(t==='light'||t==='dark')d.setAttribute('data-theme',t);}catch(e){}})();
</script>
</head>
